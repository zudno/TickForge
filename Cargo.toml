# Workspace virtual de TickForge.
# La regla de dependencias de Clean Architecture se hace cumplir aquí:
# cada crate solo declara las dependencias de las capas que tiene permitido usar.

[workspace]
resolver = "3"
members = [
    "apps/trader-tui",
    "crates/domain",
    "crates/application",
    "crates/presentation-tui",
    "crates/adapters/broker-paper-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Crates internos (las versiones externas se agregan aquí al usarse por primera vez)
tickforge-domain = { path = "crates/domain" }
tickforge-application = { path = "crates/application" }
tickforge-presentation-tui = { path = "crates/presentation-tui" }
tickforge-adapter-paper-sim = { path = "crates/adapters/broker-paper-sim" }

# Dominio
rust_decimal = "1"
thiserror = "2"
# Sin la feature `clock`: el dominio no puede leer la hora del sistema, se le inyecta
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Aplicación (puertos asíncronos)
async-trait = "0.1"
futures = "0.3"

# Pruebas
rust_decimal_macros = "1"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
